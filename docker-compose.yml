services:
  postgres-db:
    image: postgres:16-alpine
    container_name: sidtra-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentiment_analysis_db
      POSTGRES_USER: sidtra_user
      POSTGRES_PASSWORD: sidtra_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidtra_user -d sentiment_analysis_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sidtra-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sidtra-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sidtra-network

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sidtra-backend-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - AMQP_URL=amqp://guest:guest@rabbitmq:5672/
      - DATABASE_URL=postgresql+asyncpg://sidtra_user:sidtra_secure_password_2026@postgres-db:5432/sentiment_analysis_db
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sidtra-network

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_ai_interface
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=America/Mexico_City
      - TZ=America/Mexico_City
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - rabbitmq
      - postgres-db
    networks:
      - sidtra-network

volumes:
  postgres_data:
    name: sidtra_postgres_volume
  n8n_data:
    name: sidtra_n8n_volume

networks:
  sidtra-network:
    name: sidtra-network
    driver: bridge
